services:
  validation-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: akatsuki_validation
      POSTGRES_USER: akatsuki_validation
      POSTGRES_PASSWORD: validation_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akatsuki_validation -d akatsuki_validation"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - akatsuki_validation_pgdata:/var/lib/postgresql/data

volumes:
  akatsuki_validation_pgdata:
